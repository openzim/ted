[files.assets.config]
target_dir="src/ted2zim/templates/assets"
execute_after=[
    "fix_ogvjs_dist .",
]

[files.assets.actions."video.js"]
action="extract_all"
source="https://github.com/videojs/video.js/releases/download/v8.23.9/video-js-8.23.9.zip"
target_dir="videojs"
remove = ["alt","examples",]

[files.assets.actions."jquery.min.js"]
action="get_file"
source="https://code.jquery.com/jquery-4.0.0.min.js"
target_file="jquery.min.js"

[files.assets.actions."tom-select.js"]
action="get_file"
source="https://cdn.jsdelivr.net/npm/tom-select@2.6.2/dist/js/tom-select.popular.min.js"
target_dir="tomselect"
target_file="tom-select.popular.min.js"

[files.assets.actions."tom-select.css"]
action="get_file"
source="https://cdn.jsdelivr.net/npm/tom-select@2.6.2/dist/css/tom-select.default.min.css"
target_dir="tomselect"
target_file="tom-select.default.min.css"

[files.assets.actions."ogv.js"]
action="extract_items"
source="https://github.com/bvibber/ogv.js/releases/download/1.9.0/ogvjs-1.9.0.zip"
zip_paths=["ogvjs-1.9.0"]
target_paths=["ogvjs"]
remove = ["ogvjs/COPYING","ogvjs/*.txt","ogvjs/*.md",]

[files.assets.actions."videojs-ogvjs.js"]
action="extract_items"
source="https://github.com/hartman/videojs-ogvjs/archive/v1.3.1.zip"
zip_paths=["videojs-ogvjs-1.3.1/dist/videojs-ogvjs.js"]
target_paths=["videojs-ogvjs.js"]

[files.assets.actions."webp-hero.polyfills.js"]
action="get_file"
source="https://unpkg.com/webp-hero@0.0.0-dev.26/dist-cjs/polyfills.js"
target_file="polyfills.js"

[files.assets.actions."webp-hero.bundle.js"]
action="get_file"
source="https://unpkg.com/webp-hero@0.0.0-dev.26/dist-cjs/webp-hero.bundle.js"
target_file="webp-hero.bundle.js"
